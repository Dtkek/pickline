# Сборка готового приложения для Windows: один файл pickline.exe со всем
# нужным внутри (Python, OpenCV, numpy, mss, pywebview). На машине
# пользователя ничего ставить и распаковывать не надо.
#
# Собирается на каждый push в main и обновляет релиз с тегом latest:
# https://github.com/Dtkek/pickline/releases/tag/latest
# Файл: pickline.exe
name: Сборка для Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Пакеты
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller numpy opencv-python-headless mss certifi pywebview

      - name: PyInstaller
        # onefile: один pickline.exe без папки рядом. При запуске он
        # распаковывается во временную папку, поэтому всё, что приложение
        # пишет (кэш, портреты, хранилище окна, обновлённые снимки), живёт
        # в %LOCALAPPDATA%\Pickline - см. app/paths.py. Лог - рядом с exe.
        # --windowed: без чёрного окна консоли; вывод в pickline.log,
        # падение - в окно сообщения (redirect_output_to_log, message_box).
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --icon app/icon.ico
          --name pickline
          --paths app
          --add-data "app/web;web"
          --add-data "app/data;data"
          --hidden-import vision.watcher
          --hidden-import vision.capture
          --hidden-import vision.recognize
          --hidden-import vision.icons
          --hidden-import sources.opendota
          --hidden-import sources.stratz
          --collect-submodules mss
          --collect-all webview
          app/server.py

      - name: Проверка запуска
        # exe должен подняться и ответить по HTTP, иначе сборка бесполезна.
        # Запускается как у пользователя: с окном (не --no-browser), из
        # папки с кириллицей в пути и с меткой «скачано из интернета» на
        # самом exe. Вывод exe печатается целиком; откат окна в браузер
        # считается провалом. Отдельно проверяется, что данные легли в
        # %LOCALAPPDATA%\Pickline, а не во временную папку распаковки.
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "Рабочий стол"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $exe = Join-Path $dir "pickline.exe"
          Copy-Item dist\pickline.exe $exe
          # ровно то, что делает браузер со скачанным файлом
          Set-Content -Path $exe -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3"
          # -NoNewWindow: запуск через CreateProcess, а не ShellExecute - иначе
          # на помеченном exe всплывает предупреждение SmartScreen, на раннере
          # его некому нажать, и запуск отменяется («canceled by the user»)
          $p = Start-Process -FilePath $exe -ArgumentList "--port","8791" -PassThru -NoNewWindow
          Start-Sleep -Seconds 25
          try {
            if ($p.HasExited) { throw "exe завершился с кодом $($p.ExitCode) до проверки" }
            $r = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8791/api/heroes"
            if ($r.StatusCode -ne 200) { throw "HTTP $($r.StatusCode)" }
            $v = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8791/api/vision/status"
            Write-Host $v.Content.Substring(0, [Math]::Min(300, $v.Content.Length))
          } finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
            Start-Sleep -Seconds 1
            Write-Host "--- pickline.log:"; Get-Content (Join-Path $dir "pickline.log") -ErrorAction SilentlyContinue
          }
          $log = Get-Content (Join-Path $dir "pickline.log") -Raw -ErrorAction SilentlyContinue
          if (-not $log) { throw "exe не создал pickline.log - вывод без консоли не перенаправился" }
          if ($log -match "окно не открылось") { throw "окно pywebview не открылось, сработал откат в браузер - см. вывод выше" }
          $data = Join-Path $env:LOCALAPPDATA "Pickline\.cache"
          if (-not (Test-Path $data)) { throw "кэш не создан в $data - данные пишутся не туда" }
          Write-Host "данные в ${data}: $((Get-ChildItem $data -Recurse -File | Measure-Object).Count) файлов"

      - name: Установщик (Inno Setup)
        # Установленные файлы не несут метку «из интернета» - никаких
        # предупреждений при запуске; SmartScreen только на сам установщик.
        # Версия - из VERSION в server.py; VersionInfoVersion требует x.x.x.x.
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $ver = (Select-String -Path app\server.py -Pattern 'VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          $fv = ($ver -replace '-', '.') -replace '\.0+(\d)', '.$1'
          & $iscc "/DAppVersion=$ver" "/DFileVersion=$fv" installer\pickline.iss | Select-Object -Last 3
          if ($LASTEXITCODE -ne 0) { throw "ISCC завершился с кодом $LASTEXITCODE" }
          Get-Item dist\pickline-setup.exe | Select-Object Name, Length

      - name: Файл версии для проверки обновлений
        # приложение при запуске сравнивает свою VERSION с этим файлом в релизе
        shell: pwsh
        run: |
          $ver = (Select-String -Path app\server.py -Pattern 'VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          Set-Content -Path dist\version.txt -Value $ver -NoNewline -Encoding ascii
          Get-Content dist\version.txt

      - name: Проверка установщика
        # тихая установка в профиль, установленный exe должен запуститься
        # и ответить по HTTP (--no-browser: окно уже проверено выше)
        shell: pwsh
        run: |
          Start-Process -FilePath dist\pickline-setup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          $exe = Join-Path $env:LOCALAPPDATA "Programs\Pickline\pickline.exe"
          if (-not (Test-Path $exe)) { throw "после установки нет $exe" }
          $p = Start-Process -FilePath $exe -ArgumentList "--no-browser","--port","8792" -PassThru -NoNewWindow
          Start-Sleep -Seconds 20
          try {
            if ($p.HasExited) { throw "установленный exe завершился с кодом $($p.ExitCode)" }
            $r = Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:8792/api/heroes"
            if ($r.StatusCode -ne 200) { throw "HTTP $($r.StatusCode)" }
            Write-Host "установленный exe отвечает"
          } finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          }

      # артефакт - запасная копия для запусков не с main; релиз ниже
      # прикладывает файлы сам. Хранилище артефактов иногда отвечает 403
      # на финализацию - из-за этого один раз падала вся сборка
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: pickline-windows
          path: |
            dist/pickline-setup.exe
            dist/pickline.exe

      # релиз и на push, и на ручной запуск: через dispatch сборку
      # запускает обновление снимка STRATZ (update-snapshots.yml)
      - name: Передвинуть тег latest
        if: github.ref == 'refs/heads/main'
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Релиз latest
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Последняя сборка
          body: |
            Автоматическая сборка из main (${{ github.sha }}).
            **`pickline-setup.exe`** - установщик: ярлыки, без предупреждений при запуске, удаление через «Программы». Рекомендуется.
            `pickline.exe` - то же приложение одним файлом без установки (Windows будет спрашивать при каждом запуске, пока не снять метку «Разблокировать» в свойствах файла).
            Python не нужен. Данные приложения (кэш, портреты, настройки) - в `%LOCALAPPDATA%\Pickline`, лог - рядом с exe.
          files: |
            dist/pickline-setup.exe
            dist/pickline.exe
            dist/version.txt
