<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pickline — голосовой тренер</title>
<link rel="stylesheet" href="/static/styles.css">
<style>
  .coach { max-width: 860px; margin: 0 auto; padding: 16px; }
  .sliders { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px 18px; }
  .sliders label { display: block; font-size: 13px; }
  .sliders input[type=range] { width: 100%; }
  #log { height: 380px; overflow-y: auto; font-size: 14px; line-height: 1.5; }
  #log .me { color: var(--muted, #9aa); }
  #log .coach-line { color: inherit; }
  #log .sys { color: #d98a2b; font-size: 12px; }
  .big { font-size: 16px; padding: 10px 18px; }
</style>
</head>
<body>
<div class="coach">
  <div class="card">
    <h2>Голосовой тренер</h2>
    <div class="dim" style="margin-bottom:8px">
      Тренер слушает микрофон, видит данные матча из игры (нужно «Подключить игру» в Pickline)
      и по вашей просьбе смотрит на экран. Говорит голосом Gemini Live.
    </div>
    <div class="controls">
      <div style="flex:1 1 320px"><label>Ключ Gemini API (aistudio.google.com → Get API key)</label>
        <input type="password" id="key" placeholder="AIza…" autocomplete="off" style="width:100%"></div>
      <button type="button" class="tab" id="key-save">Сохранить ключ</button>
    </div>
    <div id="key-note" class="dim" style="margin:4px 0 0"></div>
  </div>

  <div class="card">
    <h2>Характер</h2>
    <div class="controls">
      <div><label>Имя</label><input type="text" id="name" value="Тренер"></div>
      <div><label>Голос</label>
        <select id="voice">
          <option>Kore</option><option>Puck</option><option>Charon</option>
          <option>Fenrir</option><option>Aoede</option><option>Leda</option><option>Orus</option><option>Zephyr</option>
        </select></div>
    </div>
    <div class="sliders" style="margin-top:10px">
      <label>Агрессия советов: <b id="v-aggr">5</b><input type="range" id="aggr" min="0" max="10" value="5"></label>
      <label>Поддержка: <b id="v-support">6</b><input type="range" id="support" min="0" max="10" value="6"></label>
      <label>Сопереживание: <b id="v-empathy">5</b><input type="range" id="empathy" min="0" max="10" value="5"></label>
      <label>Юмор: <b id="v-humor">4</b><input type="range" id="humor" min="0" max="10" value="4"></label>
      <label>Болтливость: <b id="v-talk">4</b><input type="range" id="talk" min="0" max="10" value="4"></label>
      <label style="display:flex;gap:8px;align-items:center;margin-top:18px"><input type="checkbox" id="swear"> Мат разрешён</label>
    </div>
    <div class="dim" style="margin-top:6px">Характер применяется при запуске разговора.</div>
  </div>

  <div class="card">
    <div class="controls">
      <button type="button" class="big" id="start">Начать разговор</button>
      <button type="button" class="big" id="stop" disabled>Остановить</button>
      <button type="button" class="tab" id="look">Посмотри на экран</button>
      <span id="status" class="dim">не подключено</span>
    </div>
    <div id="log" style="margin-top:10px"></div>
  </div>
</div>
<script src="/static/coach.js"></script>
</body>
</html>
